<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f1e6" />
    <title>Offline · Potatoni</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f1e6;
        color: #2a2670;
        font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }
      h1 {
        margin: 0;
        font-size: 1.9rem;
        font-weight: 800;
      }
      p {
        margin: 0;
        color: #5a56a0;
        font-weight: 600;
        line-height: 1.5;
      }
      button {
        height: 56px;
        padding: 0 24px;
        border: 2px solid #2a2670;
        border-radius: 16px;
        background: #ffc62b;
        color: #2a2670;
        font: inherit;
        font-size: 1.1rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      button:active {
        transform: scale(0.97);
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgb(255 198 43 / 0.7);
      }
      small {
        color: #5a56a0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        The register and dashboard need a connection to show live orders and prices. Check the Wi-Fi or mobile data,
        then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <small>This page reloads by itself when the connection is back.</small>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
