packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@firebase/util': false
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1131.0'
  - nodemailer@10.0.8
# Security patches for transitive dependencies (pnpm audit --prod, high). Drop an entry
# once its parent package ships the fixed version itself.
overrides:
  # GHSA: custom generators can loop forever — via next > postcss > nanoid
  "nanoid@<3.3.18": "^3.3.19"
  # GHSA-3f6p-5ww8-9rcr auth-plugin downgrade + unbounded zlib inflate — via prisma CLI (MySQL tooling, unused here)
  "mysql2@<3.23.1": "^3.24.4"
  # GHSA: stack exhaustion on recursive objects — via @prisma/config (only plain deepmerge() on config objects)
  "deepmerge-ts@<8.0.0": "^8.0.2"
  # GHSA: getAuthContext can return unauthorized certificates — via firebase-admin > google-gax and
  # firebase > @firebase/firestore (pinned ~1.9; that gRPC path is Node-only, the app loads Firebase in the browser)
  "@grpc/grpc-js@<1.14.5": "^1.14.5"
  # GHSA: event-loop DoS through indexed source-map offsets — via next > postcss
  "source-map-js@<1.2.2": "^1.2.2"
  # GHSA-gg6h-894w-4m9c quadratic lookbehind matching — via firebase > @firebase/firestore
  "re2js@<2.8.7": "^2.8.7"
  # GHSA: librsvg CVE-2026-96889 — via next > sharp (optional image optimizer)
  "sharp@<0.35.5": "^0.35.5"
